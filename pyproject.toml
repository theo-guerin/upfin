[project]
name = "jellyfin-uploader"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "asgi-correlation-id>=5.0.1",
    "envkit>=0.7.0.post1",
    "fastapi>=0.139.0",
    "guessit>=4.1.0",
    "httpx>=0.28.1",
    "pathvalidate>=3.3.1",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = ["uvicorn[standard]>=0.51.0", "pyrefly>=1.1.1", "ruff>=0.15.21"]

[tool.ruff.lint]
select = ["I", "F"]

[tool.pyrefly]
project-includes = ["app/**/*.py"]
preset = "strict"
errors = { open-unpacking = "error", missing-source = "warn", unannotated-return = "warn" }

[[tool.pyrefly.sub-config]]
matches = "app/routes.py"
errors = { unannotated-return = "ignore" }
